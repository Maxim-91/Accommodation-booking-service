name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: accommodation_user
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: accommodation_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accommodation_user -d accommodation_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Backend

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://accommodation_user:1234@127.0.0.1:5432/accommodation_db_test
      DATABASE_URL: postgresql+psycopg2://accommodation_user:1234@127.0.0.1:5432/accommodation_db_test
      TOKEN_KEY: ci-test-token-key-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f "requirements-dev.txt" ]; then
            python -m pip install -r requirements-dev.txt
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -v

      - name: Run API tests
        run: python -m unittest discover -s tests/api -v

      - name: Run PostgreSQL integration tests
        run: python -m unittest discover -s tests/integration -v
